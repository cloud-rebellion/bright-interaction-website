name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Reproducible repository checks
        run: bash scripts/ci.sh
      - name: Bound static qualification artifact
        id: static_bound
        if: always()
        run: |
          test -d dist
          test "$(du -sk dist | cut -f1)" -le 262144
          test "$(find dist -type f | wc -l)" -le 20000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.static_bound.outcome == 'success'
        with:
          name: public-static-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

