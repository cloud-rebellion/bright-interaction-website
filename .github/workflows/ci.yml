name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Reproducible repository checks
        run: bash scripts/ci.sh
      - name: Bound static qualification artifact
        id: static_bound
        if: always()
        run: |
          test -d dist
          test "$(du -sk dist | cut -f1)" -le 262144
          test "$(find dist -type f | wc -l)" -le 20000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.static_bound.outcome == 'success'
        with:
          name: public-static-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  migration-lock-qualification:
    # Temporary metadata-only diagnostic. The main checks still require the
    # committed lockfile and full high-severity audit; this job cannot qualify it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Resolve reviewed package metadata without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/migration-lock"
          cat > "$RUNNER_TEMP/migration-lock/package.json" <<'PACKAGE_JSON'
          {
            "name": "bright-interaction-website",
            "type": "module",
            "version": "1.0.0",
            "scripts": {
              "dev": "astro dev",
              "start": "astro dev",
              "prebuild": "node scripts/generate-article-dates.js",
              "build": "astro build",
              "preview": "astro preview",
              "astro": "astro"
            },
            "dependencies": {
              "astro": "7.4.4",
              "@astrojs/sitemap": "3.7.4",
              "tailwindcss": "3.4.19"
            },
            "devDependencies": {
              "@types/node": "^20.0.0",
              "sharp": "0.35.5",
              "typescript": "^5.0.0",
              "postcss": "8.5.23",
              "autoprefixer": "10.4.27"
            },
            "engines": {
              "node": ">=22.23.4"
            }
          }
          PACKAGE_JSON
          cd "$RUNNER_TEMP/migration-lock"
          bun install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-lock-${{ github.sha }}
          path: |
            ${{ runner.temp }}/migration-lock/package.json
            ${{ runner.temp }}/migration-lock/bun.lock
          retention-days: 1
          if-no-files-found: error
